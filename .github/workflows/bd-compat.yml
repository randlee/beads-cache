# bd release compatibility check (REQ-BDC-0905, sprint a-2).
#
# For one bd version this installs bd on a clean runner and checks it against the
# pinned fingerprint (bd version and the sha256 of `bd schema`; the schema diff is
# attached on a difference), runs the sc-beads contract suite and the sc-bd-cli
# tests, then the live probes in a scratch workspace on a scratch Dolt server
# (NFR-BDC-0006: this workflow is the one permitted CI use of live probes).
# A failure opens or updates one issue per bd version. Regenerating the strict rows
# and cutting a semver-major release stay maintainer steps.
#
# Triggers:
# - repository_dispatch, type `beads-release`, payload {"version": "<bd version>"}
#   (sent by the beads release trigger; see P-5 in docs/plans/phase-a/phase-a-plan.md).
# - workflow_dispatch, for a manual run. With no version it checks the pinned one.
name: bd-compat

on:
  repository_dispatch:
    types: [beads-release]
  workflow_dispatch:
    inputs:
      version:
        description: "bd version to check (for example 1.3.2); empty means the pinned version"
        required: false
        default: ""
      expect_schema_sha:
        description: "Test hook for the failure path: compare against this schema sha instead of the pinned one. Leave empty."
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: bd-compat-${{ github.event.client_payload.version || inputs.version || 'pinned' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The Dolt release behind the scratch server of the live probes.
  DOLT_VERSION: "2.3.5"

defaults:
  run:
    shell: bash

jobs:
  check:
    name: bd ${{ github.event.client_payload.version || inputs.version || 'pinned' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REQUESTED_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      EXPECT_SCHEMA_SHA: ${{ inputs.expect_schema_sha }}
      OUT: ${{ github.workspace }}/bd-compat-out
    steps:
      - uses: actions/checkout@v4

      # The payload is not trusted: it is validated as a semantic version before it
      # reaches a URL, a file name or an issue title.
      - name: Resolve the bd version
        run: |
          source scripts/bd-compat/lib.sh
          version="${REQUESTED_VERSION#v}"
          if [ -z "$version" ]; then
            version="$(bdc_pinned BD_VERSION)"
          fi
          bdc_valid_version "$version" || { echo "::error::not a bd version: $version"; exit 1; }
          echo "BD_VERSION=$version" >>"$GITHUB_ENV"
          echo "PINNED_VERSION=$(bdc_pinned BD_VERSION)" >>"$GITHUB_ENV"
          mkdir -p "$OUT"

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install the bd under test
        run: |
          dir="$(scripts/bd-compat/install-bd.sh "$BD_VERSION")"
          echo "$dir" >>"$GITHUB_PATH"

      - name: Install dolt for the scratch server
        run: |
          dir="$(scripts/bd-compat/install-dolt.sh "$DOLT_VERSION")"
          echo "$dir" >>"$GITHUB_PATH"

      - name: Compare with the pinned fingerprint
        id: fingerprint
        continue-on-error: true
        run: scripts/bd-compat/fingerprint-check.sh "$BD_VERSION" "$OUT" ${EXPECT_SCHEMA_SHA:+"$EXPECT_SCHEMA_SHA"}

      - name: Contract suite and crate tests
        id: tests
        continue-on-error: true
        run: cargo test -p sc-beads -p sc-bd-cli --all-features
        env:
          RUSTFLAGS: -D warnings

      # The fingerprint step above is the authority on the pin, so the live
      # fingerprint probe is told not to insist on it.
      - name: Live probes
        id: live
        continue-on-error: true
        # Backstop: each bd call is bounded (60 s) inside the probes; this ends a run
        # that hangs anywhere else (the scratch server, cargo).
        timeout-minutes: 15
        run: scripts/bd-compat/run-live.sh
        env:
          SC_BD_PINNED_ANY: "1"

      - name: Summarize
        id: summary
        run: |
          {
            echo "## bd-compat: bd $BD_VERSION"
            echo
            echo "- fingerprint: ${{ steps.fingerprint.outcome }}"
            echo "- contract suite and crate tests: ${{ steps.tests.outcome }}"
            echo "- live probes: ${{ steps.live.outcome }}"
            echo
            cat "$OUT/summary.md" 2>/dev/null || true
          } | tee "$OUT/report.md" >>"$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.fingerprint.outcome }}" = success ] \
            && [ "${{ steps.tests.outcome }}" = success ] \
            && [ "${{ steps.live.outcome }}" = success ]; then
            echo "failed=false" >>"$GITHUB_OUTPUT"
          else
            echo "failed=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bd-compat-${{ env.BD_VERSION }}
          path: ${{ env.OUT }}
          if-no-files-found: ignore

      # One issue per bd version: a later failing run comments on the open one.
      - name: Open or update the issue
        if: steps.summary.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="bd-compat: bd $BD_VERSION"
          body="$OUT/issue.md"
          {
            cat "$OUT/report.md"
            echo
            echo "Run: $RUN_URL"
            if [ -s "$OUT/schema.diff" ]; then
              echo
              echo "<details><summary>bd schema diff against the pinned fixture</summary>"
              echo
              echo '```diff'
              # An issue body is limited to 65536 characters.
              head -c 40000 "$OUT/schema.diff"
              echo
              echo '```'
              echo "</details>"
            fi
          } >"$body"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi

      - name: Fail the run if any check failed
        if: steps.summary.outputs.failed == 'true'
        run: |
          echo "::error::bd $BD_VERSION failed the compatibility check; see the summary"
          exit 1
