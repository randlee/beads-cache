# Workspace gates for every push and pull request (sprint a-1).
#
# bd-cache-py (a PyO3 extension module) does not link under `cargo test`, so
# the workspace gates exclude it; python.yml (sprint a-8) is that crate's gate.
# bd-compat.yml (sprint a-2) runs the live bd probes; this workflow runs none.
name: ci

on:
  push:
    branches: [main, develop, "integrate/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  EXCLUDE: --exclude bd-cache-py

defaults:
  run:
    shell: bash

jobs:
  # fmt, docs, the publish dry run and the boundary check are platform
  # independent: ubuntu only.
  lint:
    name: fmt, doc, publish dry-run, boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Docs
        run: cargo doc --workspace $EXCLUDE --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Publish dry run (sc-beads)
        run: cargo publish --dry-run -p sc-beads

      - name: Crate boundaries (docs/architecture.md, Boundaries and Dependencies)
        run: |
          cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" docs/architecture.md <<'PY'
          """Fail on any workspace-crate edge the Boundaries table does not allow.

          Every dependency kind counts (normal, dev, build). A crate missing from
          the table fails too, so a new crate must be added to the table first.
          A crate's dev-dependency on itself (to enable its own test features)
          is not an edge.
          """
          import json, re, sys

          meta = json.load(open(sys.argv[1]))
          doc = open(sys.argv[2], encoding="utf-8").read()
          section = doc.split("## Boundaries and Dependencies", 1)[1].split("\n## ", 1)[0]
          allowed = {}
          for line in section.splitlines():
              cells = [c.strip() for c in line.strip().strip("|").split("|")]
              if len(cells) != 2 or not cells[0].startswith("`"):
                  continue
              crate = cells[0].strip("`")
              rule = cells[1].split("(")[0]  # parenthesised notes are commentary
              allowed[crate] = set(re.findall(r"`([^`]+)`", rule))
          members = {p["name"] for p in meta["packages"]}
          errors = []
          for pkg in meta["packages"]:
              name = pkg["name"]
              if name not in allowed:
                  errors.append(f"{name}: not in the Boundaries table of docs/architecture.md")
                  continue
              for dep in pkg["dependencies"]:
                  target = dep["name"]
                  if target in members and target != name and target not in allowed[name]:
                      kind = dep.get("kind") or "normal"
                      errors.append(f"{name} -> {target} ({kind}): not allowed")
          for e in errors:
              print(f"::error::{e}")
          if errors:
              sys.exit(1)
          print(f"boundaries ok: {sorted(members)}")
          PY

  # Clippy and tests on every supported OS (QA-004).
  test:
    name: clippy and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # bd-cache-store's compatibility test (sprint a-4) runs the reference
      # Python implementation with uv.
      - uses: astral-sh/setup-uv@v6

      - name: Clippy
        run: cargo clippy --workspace $EXCLUDE --all-targets --all-features -- -D warnings

      # Default features: the libraries must be warning-free without their
      # `testing` features (helpers are crate-private until a-5/a-6 call them).
      - name: Clippy (libraries, default features)
        run: cargo clippy --workspace $EXCLUDE --lib -- -D warnings

      - name: Test
        run: cargo test --workspace $EXCLUDE --all-features
