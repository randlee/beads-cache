# beads-cache workspace (phase a). Every third-party crate the phase uses is
# declared here once; member crates use `workspace = true` and edit only their
# own Cargo.toml (docs/plans/phase-a/phase-a-plan.md, Shared files). A missing
# workspace dependency is an amendment to sprint a-1.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"        # equals rust-toolchain.toml
license = "MIT"
repository = "https://github.com/randlee/beads-cache"
authors = ["Rand Lee <rand@randlee.com>"]

[workspace.dependencies]
# workspace crates
bd-cache = { path = "crates/bd-cache", version = "0.1.0" }
bd-cache-model = { path = "crates/bd-cache-model", version = "0.1.0" }
bd-cache-store = { path = "crates/bd-cache-store", version = "0.1.0" }
sc-bd-cli = { path = "crates/sc-bd-cli", version = "0.1.0" }
sc-beads = { path = "crates/sc-beads", version = "0.1.0" }
sc-cron = { path = "crates/sc-cron", version = "0.1.0" }

# third-party crates used in phase a
rusqlite = { version = "0.40", features = ["bundled"] }   # NFR-BDC-0007: bundled SQLite
fs4 = "1.1"                                                # drain lock (flock), a-4
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"                                              # bd schema fingerprint
toml = "1.1"                                               # .beads/bd-cache.toml
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cron = "0.17"
libc = "0.2"                                               # O_NONBLOCK for opening phase files (bd-cache-sync, a-7)
dunce = "1"                                                # canonical paths without the Windows \\?\ prefix, bd-cache-py (a-8, R12)
getrandom = "0.4"                                          # sc-cron jitter (a-3, ADR-BDC-0006)
criterion = "0.8"
tempfile = "3.20"                                          # dev-dependency only (sc-cron, bd-cache-store, bd-cache-sync, bd-cache-py tests)
pyo3 = "0.30"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
empty_structs_with_brackets = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
literal_string_with_formatting_args = "allow"
