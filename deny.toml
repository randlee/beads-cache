# cargo-deny configuration: advisories only (PE1-RSH-001).
#
# CI runs `cargo deny check advisories` in the lint job. The workspace ships
# bundled SQLite (rusqlite `bundled`), process-wrap, tokio and a git-pinned
# sc-command, and the three published crates (sc-beads, sc-bd-cli, sc-cron)
# carry the same exposure, so a RUSTSEC advisory against any of them must
# fail a gate. Licences, bans and sources are deliberately not configured.
#
# To accept an advisory that has no fixed release yet, add its id to `ignore`
# with a one-line reason: ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]

[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "Published sc-cron 0.2.0 constrains bundled SQLite; exposure requires a less-trusted db+wal pair, while our cache file is trust-checked; remove under bdc-33g when a compatible published baseline permits libsqlite3-sys >=0.39." },
    { id = "RUSTSEC-2026-0462", reason = "Published sc-command/sc-runtime 0.2.0 require rmcp ~3.8; resolved server-only use enables neither affected HTTP-client feature; remove under bdc-33g when the published baseline permits rmcp >=3.9." },
]
