# cargo-deny configuration: advisories only (PE1-RSH-001).
#
# CI runs `cargo deny check advisories` in its own non-blocking job: a failure
# is reported on every PR but does not fail the workflow. The workspace ships
# bundled SQLite (rusqlite `bundled`), process-wrap, tokio and published
# sc-command and sc-cron, so a RUSTSEC advisory must be fixed or accepted here
# in its own PR. Licences, bans and sources are deliberately not configured.
#
# To accept an advisory that has no fixed release yet, add its id to `ignore`
# with a one-line reason: ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]

[graph]
all-features = true

[advisories]
ignore = [{ id = "RUSTSEC-2026-0459", reason = "Only databases opened with a WAL written by a less trusted party are exposed; beads-cache opens its own trust-checked cache file (TrustedCacheFile). Fixed libsqlite3-sys >=0.39 needs rusqlite 0.41, blocked by published sc-cron =0.2.0. Remove when sc-cron moves to rusqlite >=0.41 (bdc-33g)." }]
