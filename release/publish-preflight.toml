# Consumer publish preflight checks. Executed from release-preflight.yml via
# .github/scripts/run-consumer-preflight.sh (fail-closed before release dispatch).

schema_version = 1


[[checks]]
id = "installed-candidate"
description = "Exact-commit manifest, isolated asset staging, checksums and installed candidate acceptance"
run = "python3 -I scripts/check_release_candidate.py preflight"