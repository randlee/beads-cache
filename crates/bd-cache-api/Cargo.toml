[package]
name = "bd-cache-api"
description = "bd-cache contract vocabulary: request and data models, the one request decoder, the operations over Cache and the error table."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# No sc-command and no clap, in any dependency kind (contract §9; the CI
# "Crate boundaries" step rejects both).
[dependencies]
# B1-STUB: the `testing` feature reaches the store for the interim adapter in
# `src/b1_stub.rs` (sprint b-1's `write_returning`, `entry_by_key`,
# `journal_counts`). Drop the feature when b-1 lands; `pending_entries` is the
# one item b-1's Public contract does not cover (see `src/b1_stub.rs`).
bd-cache = { workspace = true, features = ["testing"] }
bd-cache-model.workspace = true
sc-beads.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[dev-dependencies]
bd-cache-model = { workspace = true, features = ["testing"] }
sc-beads = { workspace = true, features = ["testing"] }

[lints]
workspace = true
