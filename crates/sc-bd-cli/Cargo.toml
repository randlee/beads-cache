[package]
name = "sc-bd-cli"
description = "The bd CLI implementation of the sc-beads backend traits: process runner, probes, version gates, dolt-mode detection and the deadline-bounded cache calls."
version.workspace = true
# btit-cli and btit-bd are edition 2021; kept so the ported code stays verbatim
# (the same reason as sc-beads, ADR-BEADS-0001).
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["beads", "bd", "issue-tracker", "cli"]
categories = ["api-bindings", "development-tools"]

[features]
# RecordingInvoker, the fake bd (FakeBd), BdCli::with_invoker and
# CliRunner::with_version_probe, for this crate's and consumers' tests.
test-support = ["sc-beads/testing"]

[dependencies]
sc-beads.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
sc-bd-cli = { path = ".", features = ["test-support"] }

[[test]]
name = "ops_argv"
required-features = ["test-support"]

[[test]]
name = "ops_behaviour"
required-features = ["test-support"]

[[test]]
name = "parity"
required-features = ["test-support"]

# The test binary is its own fake bd (see the file's header), so it has no libtest harness.
[[test]]
name = "process"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
