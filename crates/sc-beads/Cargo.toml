[package]
name = "sc-beads"
description = "Beads backend contract: btit's backend traits and types, the cache backend extension, strict bd rows, Clock and Deadline, and test doubles."
version.workspace = true
# btit-beads and btit-types are edition 2021; kept so the ported code stays verbatim.
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sc-beads"
keywords = ["beads", "bd", "issue-tracker", "backend"]
categories = ["api-bindings", "development-tools"]

[features]
# Test doubles (ManualClock, FakeBackend) and the CacheBackend contract suite.
testing = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
sc-beads = { path = ".", features = ["testing"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
