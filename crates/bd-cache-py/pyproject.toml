[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "bd-cache-rs"
description = "bd-cache in process: the Rust cache of a beads repository (maturin / PyO3)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rand Lee", email = "rand@randlee.com" }]
# abi3-py39 in Cargo.toml: one wheel per platform serves every CPython from 3.9.
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
]
version = "0.2.0"
keywords = ["beads", "bd", "cache", "sqlite"]

[project.urls]
Repository = "https://github.com/randlee/beads-cache"
Changelog = "https://github.com/randlee/beads-cache/blob/develop/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
# The mixed layout (ADR-PY-0006): the native module is bd_cache_rs._native,
# and python/bd_cache_rs/ holds __init__.py (re-exporting every name), run.py
# (python -m bd_cache_rs.run) and sync.py (bd_cache_rs.sync.main).
module-name = "bd_cache_rs._native"
python-source = "python"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
