[package]
name = "bd-cache-sync"
description = "The bd-cache sync: the built-in and Python sync rows on sc-cron, the switch and the post-sync hook."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# The internals the integration tests drive directly (`run_builtin`,
# `TickLease`, `PythonSyncJob`, `Budget`, `TrustedCacheFile`, ...): public only
# with this feature, which the dev-dependency on this crate itself enables. No
# dependent crate turns it on.
testing = []

[dependencies]
bd-cache.workspace = true
# The contract's requests and errors: bd-cache-sync runs the front-end verbs
# for every front end (`execute`) and maps their errors once (ADR-SYNC-0008
# as amended by sprint b-8; the Boundaries edge bd-cache-sync -> bd-cache-api).
bd-cache-api.workspace = true
bd-cache-model.workspace = true
sc-beads.workspace = true
bd-cache-store.workspace = true
sc-bd-cli.workspace = true
sc-cron.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# The effective uid of the trust check (TrustedCacheFile, REQ-BDC-0723,
# QA97R2-014): `rustix::process::geteuid` is a safe call, so this crate keeps
# no `unsafe`. Already in Cargo.lock (through tempfile); only the `process`
# module is turned on (the workspace entry, B8Q1-036). Named in ADR-SYNC-0008's
# dependency bullet.
rustix = { workspace = true, features = ["std", "process"] }

[dev-dependencies]
bd-cache-sync = { path = ".", features = ["testing"] }
# `bd_cache::testing::backend`: the S40 test reaches the composed backend.
bd-cache = { workspace = true, features = ["testing"] }
bd-cache-model = { workspace = true, features = ["testing"] }
sc-beads = { workspace = true, features = ["testing"] }
sc-bd-cli = { workspace = true, features = ["test-support"] }
sc-cron = { workspace = true, features = ["test-utils"] }
chrono.workspace = true
criterion.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# Informational latency numbers for NFR-BDC-0001; the asserting test is tests/perf.rs.
[[bench]]
name = "get"
harness = false

[lints]
workspace = true
