[package]
name = "sc-cron"
description = "SQLite-backed cron scheduler with generation fencing, jitter and missed-tick replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sc-cron"
keywords = ["cron", "scheduler", "sqlite", "tokio"]
categories = ["date-and-time", "asynchronous"]

[features]
# Deterministic `ManualClock` and `SeqJitter` for tests of this crate and of
# its callers.
test-utils = []

[dependencies]
async-trait.workspace = true
chrono.workspace = true
cron.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
# Per-invocation temporary working directory for a Python hook (REQ-CRON-0013).
tempfile.workspace = true
# `process` and `io-util` run a hook child and read its capped output.
tokio = { workspace = true, features = ["process", "io-util"] }
tracing.workspace = true
# Spawns a hook in a Unix process group or a Windows job object so the kill
# reaches grandchildren too (REQ-CRON-0013, ADR-CRON-0008); wraps the safe
# parts of the platform calls so this crate keeps `forbid(unsafe_code)`.
process-wrap.workspace = true

[dev-dependencies]
# Self-reference so a plain `cargo test` builds the integration tests with
# `test-utils`; no `required-features` gate silently skips them.
sc-cron = { path = ".", features = ["test-utils"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# Two processes share one database file, so the test runs a copy of itself as
# the peer; it needs its own `main` (REQ-CRON-0006, REQ-CRON-0007).
[[test]]
name = "two_process"
harness = false
