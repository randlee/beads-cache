[package]
name = "sc-cron"
description = "SQLite-backed cron scheduler with generation fencing, jitter and missed-tick replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = false
keywords = ["cron", "scheduler", "sqlite", "tokio"]
categories = ["date-and-time", "asynchronous"]

[features]
# Deterministic `ManualClock` and `SeqJitter` for tests of this crate and of
# its callers.
test-utils = []

[dependencies]
async-trait.workspace = true
chrono.workspace = true
cron.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Self-reference so a plain `cargo test` builds the integration tests with
# `test-utils`; no `required-features` gate silently skips them.
sc-cron = { path = ".", features = ["test-utils"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
